<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meu perfil · Rift Arcade</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#09090a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="icon" type="image/png" sizes="32x32" href="../shared/assets/marca/favicon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="48x48" href="../shared/assets/marca/favicon-48.png?v=2" />
<link rel="apple-touch-icon" href="../shared/assets/marca/apple-touch-icon.png?v=2" />
<link rel="stylesheet" href="../shared/account.css?v=71" />
<link rel="stylesheet" href="../css/hub.css" />
<link rel="stylesheet" href="../css/perfil.css?v=58" />
</head>
<body>
<div id="site-bar"></div>
<main class="perfil" id="perfil"><p class="muted">Carregando…</p></main>
<footer id="site-footer"></footer>
<div class="pf-toast" id="pf-toast" role="status" aria-live="polite" hidden></div>
<script>
/* Se a página não sair do "Carregando…" em 15 s (cache antigo ou internet lenta), mostra uma saída. */
setTimeout(function () {
  var el = document.getElementById('perfil');
  if (!el || !/^\s*Carregando/.test(el.textContent)) return;
  el.innerHTML = '<p class="muted">Está demorando mais que o normal. <button type="button" id="rl-forca" style="font:inherit;cursor:pointer">Recarregar</button></p>';
  document.getElementById('rl-forca').onclick = function () {
    var u = new URL(location.href); u.searchParams.set('r', Date.now()); location.replace(u.toString());
  };
}, 15000);
</script>
<script type="module" src="../js/perfil.js?v=72"></script>
</body>
</html>
