<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rift Arcade</title>
<meta name="description" content="Minigames do cenário de League of Legends: carreira, quiz e desafios. Entre para guardar seu histórico." />
<meta name="theme-color" content="#09090a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="icon" type="image/png" sizes="32x32" href="shared/assets/marca/favicon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="48x48" href="shared/assets/marca/favicon-48.png?v=2" />
<link rel="apple-touch-icon" href="shared/assets/marca/apple-touch-icon.png?v=2" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Rift Arcade" />
<meta property="og:title" content="Rift Arcade" />
<meta property="og:description" content="Minigames do cenário de League of Legends: carreira, quiz e desafios. Entre para guardar seu histórico." />
<meta property="og:url" content="https://riftarcade.com.br/" />
<meta property="og:image" content="https://riftarcade.com.br/shared/assets/marca/compartilhar.jpg?v=2" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="shared/account.css" />
<link rel="stylesheet" href="css/hub.css" />
</head>
<body>
<div id="site-bar"></div>
<main class="hub">
  <header class="hub-head">
    <p class="eyebrow">◆ Minigames do cenário de LoL</p>
    <h1 class="hub-logo"><img src="shared/assets/marca/logo-fundo-escuro.png?v=2" alt="Rift Arcade" width="900" height="339" /></h1>
    <p class="lead">Jogos rápidos e uma carreira inteira para jogar. Entre com sua conta e cada partida,
      recorde e progresso fica guardado, em qualquer aparelho.</p>
  </header>

  <section aria-labelledby="jogos-title">
    <h2 class="section-title" id="jogos-title">Jogos</h2>
    <div class="games" id="games"></div>
  </section>

  <section id="historico" aria-labelledby="hist-title">
    <div class="section-head">
      <h2 class="section-title" id="hist-title">Seu histórico</h2>
      <span class="muted small" id="hist-note"></span>
    </div>
    <div id="history"></div>
  </section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/hub.js"></script>
</body>
</html>
