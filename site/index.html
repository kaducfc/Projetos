<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rift Arcade</title>
<meta name="description" content="Minigames do cenário de League of Legends: carreira, quiz e desafios. Entre para guardar seu histórico." />
<meta name="theme-color" content="#09090a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L30 16 L16 30 L2 16 Z' fill='%23d9a82b'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="shared/account.css" />
<link rel="stylesheet" href="css/hub.css" />
</head>
<body>
<div id="site-bar"></div>
<main class="hub">
  <header class="hub-head">
    <p class="eyebrow">◆ Minigames do cenário de LoL</p>
    <h1 class="display" id="site-name">Rift Arcade</h1>
    <p class="lead">Jogos rápidos e uma carreira inteira para jogar. Entre com sua conta e cada partida,
      recorde e progresso fica guardado, em qualquer aparelho.</p>
    <p class="fan-line">Projeto de fã, gratuito e sem fins lucrativos.</p>
  </header>

  <section aria-labelledby="jogos-title">
    <h2 class="section-title" id="jogos-title">Jogos</h2>
    <div class="games" id="games"></div>
  </section>

  <section id="historico" aria-labelledby="hist-title">
    <div class="section-head">
      <h2 class="section-title" id="hist-title">Seu histórico</h2>
      <span class="muted small" id="hist-note"></span>
    </div>
    <div id="history"></div>
  </section>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/hub.js"></script>
</body>
</html>
