<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Idle Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" />
<link rel="stylesheet" href="css/style.css" />

<div id="app">
  <header id="top-bar">
    <div class="resource">
      <span class="resource-icon">💰</span>
      <span id="gold-value">0</span>
    </div>
    <div class="resource">
      <span class="resource-icon">💎</span>
      <span id="cash-value">0</span>
    </div>
    <div class="resource">
      <span class="resource-icon">🎫</span>
      <span id="event-currency-value">0</span>
    </div>
    <div class="resource">
      <span class="resource-icon">🚩</span>
      <span id="stage-value">1</span>
    </div>
    <span id="build-tag" title="Versão do jogo"></span>
  </header>

  <main>
    <section id="combat-panel">
      <div id="stage-controls">
        <button id="stage-prev" title="Estágio anterior">◀</button>
        <span id="stage-label">Estágio 1</span>
        <button id="stage-next" title="Próximo estágio">▶</button>
        <button id="stage-max" title="Ir para o estágio mais avançado">Máx ⏩</button>
      </div>

      <div id="monster-area">
        <div id="damage-popups"></div>
        <div id="monster-name"></div>
        <button id="monster-sprite" title="Clique para atacar">🐗</button>
        <div id="hp-bar-outer">
          <div id="hp-bar-fill"></div>
          <span id="hp-bar-text">0 / 0</span>
        </div>
        <div id="loot-popup"></div>
        <div id="boss-timer" class="hidden"></div>
      </div>

      <div id="player-status">
        <span id="player-hp-label">🧑 Vida</span>
        <div id="player-hp-bar-outer">
          <div id="player-hp-bar-fill"></div>
          <span id="player-hp-bar-text">0 / 0</span>
        </div>
      </div>

      <div id="dps-readout">
        <span>Dano de clique: <strong id="click-damage-value">0</strong></span>
        <span>DPS: <strong id="dps-value">0</strong></span>
        <span>Armadura: <strong id="armor-value">0</strong></span>
      </div>
      <div id="element-readout">
        <span>Elemento da arma: <strong id="weapon-element-value"></strong></span>
        <span id="element-matchup"></span>
      </div>
    </section>

    <nav id="tab-nav">
      <button class="tab-btn active" data-tab="equipment">🎽 Equipamento</button>
      <button class="tab-btn" data-tab="cards">🃏 Cartas</button>
      <button class="tab-btn" data-tab="upgrades">📈 Upgrades</button>
      <button class="tab-btn" data-tab="events">🎪 Eventos</button>
      <button class="tab-btn" data-tab="achievements">🏆 Conquistas</button>
      <button class="tab-btn" data-tab="shop">🛒 Loja</button>
    </nav>

    <section id="tab-panels">
      <div id="tab-equipment" class="tab-panel active"></div>
      <div id="tab-cards" class="tab-panel"></div>
      <div id="tab-upgrades" class="tab-panel"></div>
      <div id="tab-events" class="tab-panel"></div>
      <div id="tab-achievements" class="tab-panel"></div>
      <div id="tab-shop" class="tab-panel"></div>
    </section>
  </main>

  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <button id="modal-close">Fechar</button>
    </div>
  </div>

  <div id="toast-container"></div>
</div>

<script type="module" src="js/main.js"></script>
